<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="nav">
    <div class="nav-container">
      <a href="./index.html" class="nav-logo"><span class="logo-g">G</span>Shaft<span>Master</span></a>

      <div class="nav-links">
        <a href="./index.html" class="nav-link">Home</a>
        <a href="./reviews.html" class="nav-link">Reviews</a>
        <a href="./guides.html" class="nav-link">Guides</a>
        <a href="./news.html" class="nav-link active">News</a>
      </div>

      <button class="nav-mobile-toggle" aria-label="Toggle navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </nav>

  <!-- Mobile Menu -->
  <div class="nav-mobile-menu">
    <a href="./index.html" class="nav-link">Home</a>
    <a href="./reviews.html" class="nav-link">Reviews</a>
    <a href="./guides.html" class="nav-link">Guides</a>
    <a href="./news.html" class="nav-link active">News</a>
  </div>

  <!-- News Listing -->
  <section class="section bg-light">
    <div class="container">
      <div class="section-header">
        <h1 class="section-title">All News</h1>
        <a href="./index.html" class="section-link">Back to Home</a>
      </div>

      <div class="grid grid-3" id="news-list">
        <p>Loading news...</p>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-grid">
        <div class="footer-brand">
          <div class="footer-logo"><span class="logo-g">G</span>Shaft<span>Master</span></div>
          <p class="footer-description">Professional golf shaft reviews and guides for every golfer.</p>
        </div>
      </div>
      <div class="footer-bottom">
        <p>&copy; 2024 GShaftMaster Pro. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script>
    
    const newsItems = [
      './news/news-fujikura-ventus-2025.html',
      './news/news-mitsubishi-diamana-6th-gen.html',
      './news/news-hzrdus-gen5.html',
      './news/news-hzrdus-rdx.html',
      './news/news-aldila-rogue-black-hybrid.html',
      './news/news-aldila-rogue-infinity.html'
    ];

    async function loadNews() {
      const grid = document.getElementById('news-list');
      grid.innerHTML = '';

      for (const url of newsItems) {
        try {
          const response = await fetch(url);
          const html = await response.text();
          const parser = new DOMParser();
          const doc = parser.parseFromString(html, 'text/html');

          const title = doc.querySelector('.page-header-title-dark')?.textContent?.trim() ||
                       doc.querySelector('.article-title')?.textContent?.trim() || 'Untitled';

          const excerpt = doc.querySelector('.page-header-description-dark')?.textContent?.trim() || '';
          const imageEl = doc.querySelector('.article-image img');
          const image = imageEl?.src || '';

          
          const dateEl = doc.querySelector('.breadcrumb-dark span:last-child');
          const date = dateEl?.textContent?.trim() || '';

          const card = document.createElement('article');
          card.className = 'card';
          card.innerHTML = `
            <div class="card-image">
              ${image ? `<img src="${image}" alt="${title}" loading="lazy">` : ''}
            </div>
            <div class="card-content">
              <span class="card-tag">News</span>
              <h3 class="card-title"><a href="${url}">${title}</a></h3>
              <p class="card-excerpt">${excerpt.substring(0, 80)}${excerpt.length > 80 ? '...' : ''}</p>
              ${date ? `<div class="card-meta"><span>${date}</span></div>` : ''}
            </div>
          `;
          grid.appendChild(card);
        } catch (e) {
          console.error('Error loading news:', url, e);
        }
      }
    }

    loadNews();
  </script>

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
}

</style>
</body>
</html>
